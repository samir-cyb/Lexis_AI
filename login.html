<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="i18n-title" content="login_title">
  <title>Log In — LexisAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mature-theme.css">
  <link rel="stylesheet" href="css/kid-theme.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙</text></svg>">
</head>
<body class="mature-theme">

  <!-- Background Effects -->
  <div style="position:fixed;inset:0;z-index:0;">
    <div class="hero-gradient-orb orb1" style="opacity:0.2;"></div>
    <div class="hero-gradient-orb orb2" style="opacity:0.15;"></div>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <!-- Logo -->
      <div style="text-align:center;margin-bottom:2rem;">
        <a href="index.html" class="nav-logo" style="justify-content:center;">
          <div class="nav-logo-icon">🎙</div>
          <span data-i18n="app_name">LexisAI</span>
        </a>
      </div>

      <h2 data-i18n="login_title">Welcome Back</h2>
      <p class="subtitle" data-i18n="login_subtitle">Continue your speech therapy journey</p>

      <!-- Demo Quick Login (shown when no Supabase) -->
      <div id="demoQuickLogin" style="display:none;">
        <button class="btn btn-accent" style="width:100%;margin-bottom:1rem;font-size:1.05rem;" onclick="handleDemoLogin()">
          🚀 Try Demo (No Account Needed)
        </button>
        <div class="auth-divider">or sign in with email</div>
      </div>

      <!-- Social Login (hidden in demo mode) -->
      <div class="social-buttons" id="socialButtons">
        <button class="social-btn" onclick="handleGoogleLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          <span data-i18n="login_google">Continue with Google</span>
        </button>
        <button class="social-btn" onclick="handleGitHubLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          <span data-i18n="login_github">Continue with GitHub</span>
        </button>
      </div>

      <div class="auth-divider" id="socialDivider">or</div>

      <!-- Email Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label data-i18n="login_email">Email Address</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label data-i18n="login_password">Password</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
        </div>
        <div style="text-align:right;margin-bottom:1rem;">
          <a href="#" style="font-size:0.85rem;" onclick="handleForgotPassword()" data-i18n="login_forgot">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn" data-i18n="login_button">Log In</button>
      </form>

      <!-- Demo mode notice -->
      <div id="demoNotice" style="display:none;margin-top:1rem;padding:0.75rem;border-radius:10px;background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.2);font-size:0.8rem;color:rgba(255,255,255,0.6);text-align:center;">
        🔧 Demo Mode: Accounts are stored locally on this device. Data will be lost if browser storage is cleared.
      </div>

      <div class="auth-footer">
        <span data-i18n="login_no_account">Don't have an account?</span>
        <a href="signup.html" data-i18n="login_signup_link">Sign Up</a>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/subscription.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initSupabase();
      i18n.init();
      Auth.init();

      // Show/hide UI based on demo mode
      if (Auth.isDemoMode()) {
        document.getElementById('demoQuickLogin').style.display = 'block';
        document.getElementById('socialButtons').style.display = 'none';
        document.getElementById('socialDivider').style.display = 'none';
        document.getElementById('demoNotice').style.display = 'block';
      }

      // If already logged in, redirect
      if (Auth.currentUser) {
        window.location.href = 'dashboard.html';
      }
    });

    async function handleDemoLogin() {
      const result = await Auth.demoQuickLogin();
      if (result.success) {
        Utils.showToast('Demo mode activated! Explore the app freely.', 'success');
        setTimeout(() => window.location.href = 'onboarding.html', 500);
      }
    }

    async function handleGoogleLogin() {
      const result = await Auth.signInWithGoogle();
      if (result?.error) Utils.showToast(result.error, 'error');
    }

    async function handleGitHubLogin() {
      const result = await Auth.signInWithGitHub();
      if (result?.error) Utils.showToast(result.error, 'error');
    }

    function handleForgotPassword() {
      if (Auth.isDemoMode()) {
        Utils.showToast('In Demo Mode, just create a new account.', 'info');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      btn.innerHTML = '<div class="spinner"></div>';
      btn.disabled = true;

      const result = await Auth.signIn(email, password);

      if (result.error) {
        Utils.showToast(result.error, 'error');
        btn.textContent = i18n.t('login_button');
        btn.disabled = false;
      } else {
        Utils.showToast('Welcome back!', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 500);
      }
    }
  </script>
</body>
</html>
